[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    integration: uses the real FastEmbed model (downloads ~70 MB on first run)
    live: calls a real external LLM API; skipped unless RUN_LIVE_LLM_TESTS=1 and a key is set
filterwarnings =
    ignore:.*cache-system uses symlinks.*:UserWarning
